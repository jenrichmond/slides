
<style>
  .word { opacity: 0; animation: fadeIn 0.6s ease forwards; }
  @keyframes fadeIn { from { opacity: 0; transform: scale(0.85); } to { opacity: 1; transform: scale(1); } }
</style>
<svg width="100%" viewBox="0 0 680 420" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Animated word cloud of researcher emotions</title>
  <desc>Words appearing one by one: scattered, stuck, lonely, behind, uncertain, daunted, hesitant, out of your depth, like you are guessing, then overwhelmed last and largest.</desc>

  <text class="word" x="185" y="130" text-anchor="middle" font-family="var(--font-sans)" font-size="38" font-weight="400" fill="var(--color-text-secondary)" style="animation-delay:0.2s">scattered</text>

  <text class="word" x="490" y="120" text-anchor="middle" font-family="var(--font-sans)" font-size="32" font-weight="400" fill="var(--color-text-secondary)" style="animation-delay:0.7s">stuck</text>

  <text class="word" x="120" y="210" text-anchor="middle" font-family="var(--font-sans)" font-size="30" font-weight="400" fill="var(--color-text-secondary)" style="animation-delay:1.2s">lonely</text>

  <text class="word" x="500" y="205" text-anchor="middle" font-family="var(--font-sans)" font-size="42" font-weight="500" fill="var(--color-text-primary)" opacity="0.75" style="animation-delay:1.7s">behind</text>

  <text class="word" x="200" y="270" text-anchor="middle" font-family="var(--font-sans)" font-size="34" font-weight="400" fill="var(--color-text-secondary)" style="animation-delay:2.2s">uncertain</text>

  <text class="word" x="530" y="278" text-anchor="middle" font-family="var(--font-sans)" font-size="24" font-weight="400" fill="var(--color-text-tertiary)" style="animation-delay:2.7s">hesitant</text>

  <text class="word" x="340" y="175" text-anchor="middle" font-family="var(--font-sans)" font-size="26" font-weight="400" fill="var(--color-text-tertiary)" style="animation-delay:3.2s">out of your depth</text>

  <text class="word" x="150" y="345" text-anchor="middle" font-family="var(--font-sans)" font-size="36" font-weight="400" fill="var(--color-text-secondary)" style="animation-delay:3.7s">daunted</text>

  <text class="word" x="420" y="340" text-anchor="middle" font-family="var(--font-sans)" font-size="28" font-weight="400" fill="var(--color-text-tertiary)" style="animation-delay:4.2s">like you are guessing</text>

  <text class="word" x="340" y="255" text-anchor="middle" font-family="var(--font-sans)" font-size="72" font-weight="500" fill="var(--color-text-primary)" style="animation-delay:5s">overwhelmed</text>
</svg>
